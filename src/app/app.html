<p>
  @if (booksResource.isLoading()) {
    Loading...
  }

  @if (booksResource.value(); as books) {
    <ul>
      @for (book of books; track book.id) {
        <li>{{ book.title }}</li>
      }
    </ul>
  }

  {{ userId() === 1 ? 'User 1' : 'User 2' }}

  <button (click)="toggleUser()">Toggle User</button>
</p>
